<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #edf7f5; }
      .subtitle { font: 18px Consolas, monospace; fill: #8ca3ad; }
      .panel-title { font: 700 20px Arial, sans-serif; fill: #d9e8e6; }
      .label { font: 16px Consolas, monospace; fill: #8ca3ad; }
      .tick { font: 14px Consolas, monospace; fill: #718792; }
      .annotation { font: 700 18px Consolas, monospace; fill: #ff7b72; }
    </style>
    <linearGradient id="failureFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5f67" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#ff5f67" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="900" fill="#0b0f14"/>
  <text x="70" y="62" class="title">Training failure evidence — Loss NaN</text>
  <text x="70" y="94" class="subtitle">AMP enabled · no gradient clipping · fixed data order (seed 42)</text>
  <text x="1330" y="62" text-anchor="end" class="subtitle">SYNTHETIC CASE</text>

  <rect x="70" y="120" width="610" height="620" rx="12" fill="#101922" stroke="#293843"/>
  <rect x="720" y="120" width="610" height="620" rx="12" fill="#101922" stroke="#293843"/>
  <text x="100" y="158" class="panel-title">Training Loss</text>
  <text x="750" y="158" class="panel-title">Gradient norm (log scale)</text>

  <g stroke="#263640" stroke-width="1">
    <line x1="110" y1="220" x2="640" y2="220"/><line x1="110" y1="330" x2="640" y2="330"/>
    <line x1="110" y1="440" x2="640" y2="440"/><line x1="110" y1="550" x2="640" y2="550"/>
    <line x1="110" y1="660" x2="640" y2="660"/>
    <line x1="110" y1="200" x2="110" y2="660"/><line x1="242" y1="200" x2="242" y2="660"/>
    <line x1="374" y1="200" x2="374" y2="660"/><line x1="506" y1="200" x2="506" y2="660"/>
    <line x1="638" y1="200" x2="638" y2="660"/>
  </g>
  <g class="tick">
    <text x="92" y="225" text-anchor="end">10</text><text x="92" y="335" text-anchor="end">7.5</text>
    <text x="92" y="445" text-anchor="end">5</text><text x="92" y="555" text-anchor="end">2.5</text>
    <text x="92" y="665" text-anchor="end">0</text>
    <text x="110" y="690" text-anchor="middle">1</text><text x="242" y="690" text-anchor="middle">5</text>
    <text x="374" y="690" text-anchor="middle">10</text><text x="506" y="690" text-anchor="middle">15</text>
    <text x="638" y="690" text-anchor="middle">20</text>
    <text x="375" y="722" text-anchor="middle">Epoch</text>
  </g>
  <path d="M112 475 L138 505 L164 529 L190 546 L216 554 L242 565 L268 573 L294 579 L320 584 L346 586 L372 590 L398 592 L424 595 L450 229" fill="none" stroke="#52d9b5" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M450 229 L475 325 L500 430 L525 535 L550 660 L640 660 L640 200 L450 200 Z" fill="url(#failureFill)"/>
  <circle cx="424" cy="595" r="7" fill="#52d9b5"/>
  <circle cx="450" cy="229" r="9" fill="#ff7b72"/>
  <path d="M475 200 L475 660" stroke="#ff7b72" stroke-width="2" stroke-dasharray="8 8" opacity="0.65"/>
  <text x="493" y="270" class="annotation">Epoch 14: Loss = 9.80</text>
  <text x="493" y="305" class="annotation">then NaN</text>
  <text x="150" y="430" class="label" fill="#52d9b5">Normal decrease</text>

  <g stroke="#263640" stroke-width="1">
    <line x1="760" y1="220" x2="1290" y2="220"/><line x1="760" y1="330" x2="1290" y2="330"/>
    <line x1="760" y1="440" x2="1290" y2="440"/><line x1="760" y1="550" x2="1290" y2="550"/>
    <line x1="760" y1="660" x2="1290" y2="660"/>
    <line x1="760" y1="200" x2="760" y2="660"/><line x1="892" y1="200" x2="892" y2="660"/>
    <line x1="1024" y1="200" x2="1024" y2="660"/><line x1="1156" y1="200" x2="1156" y2="660"/>
    <line x1="1288" y1="200" x2="1288" y2="660"/>
  </g>
  <g class="tick">
    <text x="742" y="225" text-anchor="end">inf</text><text x="742" y="335" text-anchor="end">100</text>
    <text x="742" y="445" text-anchor="end">10</text><text x="742" y="555" text-anchor="end">1</text>
    <text x="742" y="665" text-anchor="end">0.1</text>
    <text x="760" y="690" text-anchor="middle">1</text><text x="892" y="690" text-anchor="middle">5</text>
    <text x="1024" y="690" text-anchor="middle">10</text><text x="1156" y="690" text-anchor="middle">15</text>
    <text x="1288" y="690" text-anchor="middle">20</text>
    <text x="1025" y="722" text-anchor="middle">Epoch</text>
  </g>
  <path d="M762 555 L788 549 L814 542 L840 536 L866 526 L892 520 L918 515 L944 508 L970 503 L996 496 L1022 489 L1048 476 L1074 460 L1100 305 L1126 215" fill="none" stroke="#f2b35f" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="1074" cy="460" r="7" fill="#f2b35f"/>
  <circle cx="1100" cy="305" r="8" fill="#f2b35f"/>
  <circle cx="1126" cy="215" r="10" fill="#ff7b72"/>
  <text x="1148" y="220" class="annotation">inf</text>
  <text x="1108" y="340" class="label">128.6</text>
  <path d="M1126 235 L1126 625" stroke="#ff7b72" stroke-width="2" stroke-dasharray="8 8" opacity="0.65"/>
  <text x="1148" y="620" class="annotation">gradient first</text>

  <rect x="70" y="775" width="1260" height="82" rx="10" fill="#111c24" stroke="#293843"/>
  <text x="100" y="810" class="label">Epoch 13: loss=1.20, grad_norm=128.6</text>
  <text x="690" y="810" class="annotation">Epoch 14: grad_norm=inf → Loss NaN</text>
  <text x="100" y="840" class="subtitle">Observed order: gradient anomaly precedes parameter and loss failure.</text>
</svg>
